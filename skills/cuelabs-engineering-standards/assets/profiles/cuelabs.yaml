schemaVersion: 1
name: cuelabs
extends: base
description: CueLABS organization policy layered over the portable base profile.

identity:
  provider: firebase
  interactiveSignIn:
    - google

delivery:
  web: firebase-app-hosting
  api: cloud-run
  selfHost: helm
  infrastructure: cuesoft-iac
  secretSource: doppler

architecture:
  primaryApiDirectory: api/common
  primaryApiLanguage: go
  defaultApiTransport: http-json
  optionalApiTransports:
    - grpc
  webDirectory: web
  mobileDirectory: mobile/flutter

observability:
  standard: opentelemetry
  transport: otlp

messaging:
  broker: aiven-kafka
  shared: true
  contract: skills/cuelabs-delivery-standard/references/shared-messaging.md
  topics:
    - cuelabs.uploads
    - cuelabs.requests
    - cuelabs.results
  eventType: <product>.<domain>.<event>
  keepAliveOwner: recorded-in-product-decisions

sharedFiles:
  source: assets/templates
  overwriteExisting: false
