# Example local stack. Copy to repo root as docker-compose.yml and adapt
# services to the repo. `make up` runs `docker compose up --build -d`.
services:
  api-common:
    build: ./api/common
    image: cuesoft/REPO-api-common:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped

  # Add one block per additional service that exists, e.g. api/<service>:
  # api-<service>:
  #   build: ./api/<service>
  #   ...
  #
  # Multi-service pipelines (e.g. a Node gateway + a Python processing
  # service, connected by Aiven Kafka rather than a direct call) add a block
  # per real service the same way — see repository-and-services.md's
  # "Multi-service pipelines" section. Kafka itself is never a compose
  # service; it's the managed Aiven instance, wired via KAFKA_BROKERS/
  # KAFKA_USERNAME/KAFKA_PASSWORD/KAFKA_SSL_CA in each service's environment.

  web:
    image: cuesoft/REPO-web:latest
    build:
      context: ./web
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      api-common:
        condition: service_healthy
    restart: unless-stopped
