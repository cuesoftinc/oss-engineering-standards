# Example local stack. Copy to repo root as docker-compose.yml and adapt
# services to the repo. `make up` runs `docker compose up --build -d`.
services:
  api-common:
    build: ./api/common
    image: cuesoft/REPO-api-common:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped

  # Add one block per additional service that exists, e.g. api/<service>:
  # api-<service>:
  #   build: ./api/<service>
  #   ...
  #
  # Multi-service pipelines (e.g. a Node gateway + a Python processing
  # service, connected by Kafka rather than a direct call) add a block per
  # real service the same way; see repository-and-services.md's
  # "Multi-service pipelines" section. A product on Kafka also runs its own
  # single local broker; the shared bus is for deployed services only
  # (shared-messaging.md, "Environments"). Its services set
  # KAFKA_BROKERS: kafka:9092 and leave KAFKA_USERNAME unset (plain text):
  # kafka:
  #   image: apache/kafka:4.4.0
  #   environment:
  #     KAFKA_NODE_ID: 1
  #     KAFKA_PROCESS_ROLES: broker,controller
  #     KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  #     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  #     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_NUM_PARTITIONS: 2
  #   restart: unless-stopped

  web:
    image: cuesoft/REPO-web:latest
    build:
      context: ./web
      args:
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-demo-local}
        NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST:-localhost:9099}
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      API_URL: http://api-common:8080
    depends_on:
      api-common:
        condition: service_healthy
    restart: unless-stopped
